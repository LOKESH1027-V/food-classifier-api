
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Food Image Classifier</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

<div class="container py-5">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Food Image Classifier
        </h1>

        <p class="text-muted">
            Upload a food image and get an AI-powered food analysis.
        </p>

    </div>


    <!-- =========================
         UPLOAD FORM
    ========================== -->

    <div class="card shadow-sm p-4">

        <form
            id="predictionForm"
            enctype="multipart/form-data"
            onsubmit="predictFood(event)"
        >

            <!-- IMAGE -->

            <div class="mb-4">

                <label
                    for="image"
                    class="form-label fw-semibold"
                >
                    Choose a food image
                </label>

                <input
                    type="file"
                    class="form-control"
                    id="image"
                    name="file"
                    accept="image/*"
                    required
                >

            </div>


            <!-- IMAGE PREVIEW -->

            <div
                id="previewContainer"
                class="text-center mb-4"
                style="display: none;"
            >

                <img
                    id="imagePreview"
                    src=""
                    alt="Image Preview"
                    class="img-fluid rounded"
                    style="max-height: 300px;"
                >

            </div>


            <!-- QUESTION -->

            <div class="mb-4">

                <label
                    for="question"
                    class="form-label fw-semibold"
                >
                    Ask about this food
                    <span class="text-muted">
                        (Optional)
                    </span>
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="question"
                    name="question"
                    placeholder="Example: How many calories does this have?"
                >

                <div class="form-text">
                    Leave this empty to get a general overview.
                </div>

            </div>


            <!-- BUTTON -->

            <div class="text-center">

                <button
                    type="submit"
                    class="btn btn-primary px-4"
                    id="predictButton"
                >
                    Predict
                </button>

            </div>

        </form>

    </div>


    <!-- =========================
         ERROR
    ========================== -->

    <div
        id="errorMessage"
        class="alert alert-danger mt-4"
        style="display: none;"
    ></div>


    <!-- =========================
         RESULT
    ========================== -->

    <div
        id="resultSection"
        class="card shadow-sm p-4 mt-4"
        style="display: none;"
    >

        <h3 class="mb-4">
            Prediction Result
        </h3>


        <!-- PREDICTION -->

        <div class="mb-3">

            <strong>
                Prediction:
            </strong>

            <span
                id="prediction"
                class="badge bg-success"
            ></span>

        </div>


        <!-- CONFIDENCE -->

        <div class="mb-4">

            <strong>
                Confidence:
            </strong>

            <span id="confidence"></span>

        </div>


        <!-- PROBABILITIES -->

        <h5 class="mb-3">
            Class Probabilities
        </h5>


        <!-- PIZZA -->

        <div class="mb-3">

            <div class="d-flex justify-content-between">

                <span>
                    Pizza
                </span>

                <span id="pizzaProbability">
                    0%
                </span>

            </div>

            <div class="progress">

                <div
                    id="pizzaBar"
                    class="progress-bar"
                    role="progressbar"
                    style="width: 0%;"
                ></div>

            </div>

        </div>


        <!-- STEAK -->

        <div class="mb-3">

            <div class="d-flex justify-content-between">

                <span>
                    Steak
                </span>

                <span id="steakProbability">
                    0%
                </span>

            </div>

            <div class="progress">

                <div
                    id="steakBar"
                    class="progress-bar"
                    role="progressbar"
                    style="width: 0%;"
                ></div>

            </div>

        </div>


        <!-- SUSHI -->

        <div class="mb-3">

            <div class="d-flex justify-content-between">

                <span>
                    Sushi
                </span>

                <span id="sushiProbability">
                    0%
                </span>

            </div>

            <div class="progress">

                <div
                    id="sushiBar"
                    class="progress-bar"
                    role="progressbar"
                    style="width: 0%;"
                ></div>

            </div>

        </div>


        <hr class="my-4">


        <!-- =========================
             AI ASSISTANT
        ========================== -->

        <h4 class="mb-3">
            AI Food Assistant
        </h4>

        <div
            id="agentResponse"
            class="p-3 border rounded bg-light"
            style="white-space: pre-wrap;"
        ></div>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script>

    /*
    ========================================
    GET HTML ELEMENTS
    ========================================
    */

    const imageInput =
        document.getElementById("image");

    const questionInput =
        document.getElementById("question");

    const imagePreview =
        document.getElementById("imagePreview");

    const previewContainer =
        document.getElementById("previewContainer");

    const resultSection =
        document.getElementById("resultSection");

    const errorMessage =
        document.getElementById("errorMessage");

    const predictButton =
        document.getElementById("predictButton");


    /*
    ========================================
    IMAGE PREVIEW
    ========================================
    */

    imageInput.addEventListener(
        "change",
        function () {

            const file =
                imageInput.files[0];

            if (!file) {

                previewContainer.style.display =
                    "none";

                imagePreview.src = "";

                return;
            }

            const imageURL =
                URL.createObjectURL(file);

            imagePreview.src =
                imageURL;

            previewContainer.style.display =
                "block";
        }
    );


    /*
    ========================================
    PREDICT FOOD
    ========================================
    */

    async function predictFood(event) {

        /*
        VERY IMPORTANT

        Prevent the browser from performing
        the normal form submission.

        This prevents page refresh.
        */

        event.preventDefault();
        event.stopPropagation();

        console.log(
            "FORM SUBMITTED"
        );


        /*
        Hide previous error/result
        */

        errorMessage.style.display =
            "none";

        resultSection.style.display =
            "none";


        /*
        Get selected image
        */

        const file =
            imageInput.files[0];


        /*
        Get optional question
        */

        const question =
            questionInput.value.trim();


        /*
        Check image
        */

        if (!file) {

            showError(
                "Please select an image."
            );

            return;
        }


        /*
        Create FormData
        */

        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "question",
            question
        );


        /*
        Disable button
        */

        predictButton.disabled =
            true;

        predictButton.textContent =
            "Analyzing...";


        try {

            console.log(
                "Sending request..."
            );


            /*
            Send request to FastAPI
            */

            const response =
                await fetch(
                    "/predict",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            console.log(
                "Response received:",
                response.status
            );


            /*
            Convert response to JSON
            */

            const data =
                await response.json();


            console.log(
                "FULL API RESPONSE:",
                data
            );


            /*
            Check HTTP status
            */

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Prediction failed."
                );
            }


            /*
            ========================================
            PREDICTION
            ========================================
            */

            document.getElementById(
                "prediction"
            ).textContent =
                data.prediction;


            /*
            ========================================
            CONFIDENCE
            ========================================
            */

            document.getElementById(
                "confidence"
            ).textContent =
                (
                    data.confidence * 100
                ).toFixed(2) + "%";


            /*
            ========================================
            PROBABILITIES
            ========================================
            */

            updateProbability(
                "pizza",
                data.probabilities.pizza
            );


            updateProbability(
                "steak",
                data.probabilities.steak
            );


            updateProbability(
                "sushi",
                data.probabilities.sushi
            );


            /*
            ========================================
            AI RESPONSE
            ========================================
            */

            displayAgentResponse(
                data.agent_response
            );


            /*
            Show results
            */

            resultSection.style.display =
                "block";

        }

        catch (error) {

            console.error(
                "Prediction error:",
                error
            );

            showError(
                error.message
            );

        }

        finally {

            /*
            Enable button again
            */

            predictButton.disabled =
                false;

            predictButton.textContent =
                "Predict";
        }
    }


    /*
    ========================================
    DISPLAY AI RESPONSE
    ========================================
    */

    function displayAgentResponse(response) {

        const agentElement =
            document.getElementById(
                "agentResponse"
            );


        /*
        Response is already a string
        */

        if (
            typeof response ===
            "string"
        ) {

            agentElement.textContent =
                response;

            return;
        }


        /*
        No response
        */

        if (
            response === null ||
            response === undefined
        ) {

            agentElement.textContent =
                "No AI response available.";

            return;
        }


        /*
        Response is an object
        */

        if (
            typeof response ===
            "object"
        ) {

            /*
            If object has content
            */

            if (
                typeof response.content ===
                "string"
            ) {

                agentElement.textContent =
                    response.content;

                return;
            }


            /*
            If object has response
            */

            if (
                typeof response.response ===
                "string"
            ) {

                agentElement.textContent =
                    response.response;

                return;
            }


            /*
            Otherwise convert object
            to readable JSON
            */

            agentElement.textContent =
                JSON.stringify(
                    response,
                    null,
                    2
                );

            return;
        }


        /*
        Fallback
        */

        agentElement.textContent =
            String(response);
    }


    /*
    ========================================
    UPDATE PROBABILITY
    ========================================
    */

    function updateProbability(
        food,
        probability
    ) {

        const percentage =
            probability * 100;


        /*
        Percentage text
        */

        document.getElementById(
            food + "Probability"
        ).textContent =
            percentage.toFixed(2) + "%";


        /*
        Progress bar
        */

        document.getElementById(
            food + "Bar"
        ).style.width =
            percentage + "%";
    }


    /*
    ========================================
    SHOW ERROR
    ========================================
    */

    function showError(message) {

        errorMessage.textContent =
            message;

        errorMessage.style.display =
            "block";
    }

</script>

</body>

</html>
